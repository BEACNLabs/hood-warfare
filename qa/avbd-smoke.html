<!doctype html><title>avbd smoke</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/webgpu": "../vendor/three-avbd/webgpu-shim.js", "three-avbd": "../vendor/three-avbd/lib/world.js" } }</script>
<script type="module">
import { World } from 'three-avbd';
const log = (m) => { document.body.insertAdjacentHTML('beforeend', '<pre>' + m + '</pre>'); console.log(m); };
try {
  const t0 = performance.now();
  const adapter = await navigator.gpu.requestAdapter(); const device = await adapter.requestDevice();
  const Q = new URLSearchParams(location.search); const DENS = +Q.get('dens') || 8, DV = +Q.get('dv') || 6;
  const world = await World.create({ device, maxBodies: 4096, iterations: +Q.get('it') || 6 });
  world.addBox({ size: [60, 1, 60], position: [0, -0.5, 0], fixed: true });
  // a 15 x 7 block wall, blocks 0.4 x 0.2 x 0.2, welded to neighbours
  const bricks = []; const W = 15, H = 7, S = +new URLSearchParams(location.search).get('strength') || 20;
  for (let r = 0; r < H; r++) { bricks.push([]); for (let c = 0; c < W; c++) { const off = (r % 2) * 0.2; bricks[r].push(world.addBox({ size: [0.4, 0.2, 0.2], position: [c * 0.4 - W * 0.2 + 0.2 + off, 0.1 + r * 0.2, 0], density: DENS, friction: 0.6 })); } }
  let joints = 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (c > 0) { world.addJoint(bricks[r][c - 1], bricks[r][c], { anchorA: [0.2, 0, 0], anchorB: [-0.2, 0, 0], breakForce: S, breakOnPull: !!+Q.get("pull") }); joints++; }
    if (r > 0) { world.addJoint(bricks[r - 1][c], bricks[r][c], { anchorA: [0, 0.1, 0], anchorB: [0, -0.1, 0], breakForce: S, breakOnPull: !!+Q.get("pull") }); joints++; }
  }
  const flat = bricks.flat(); world.readbackEvery = 1; world.track(flat);
  const stats = async (label) => { await world.read(flat); let moved = 0, maxy = 0, far = 0, maxv = 0, nan = 0; for (const b of flat) { const p = b.position, v = b.velocity; if (!isFinite(p[0] + p[1] + p[2])) { nan++; continue; } if (Math.abs(p[2]) > 0.3) moved++; maxy = Math.max(maxy, p[1]); if (Math.hypot(p[0], p[2]) > 8) far++; maxv = Math.max(maxv, Math.hypot(v[0], v[1], v[2])); } label += ` far=${far} maxV=${maxv.toFixed(1)} nan=${nan}`; const broken = [...(world.joints || [])].length; log(`${label}: moved=${moved}/${flat.length} maxY=${maxy.toFixed(2)} steps=${world.stepCount}`); };
  let broken = 0; world.onBreak(() => broken++);
  const tA = performance.now(); for (let i = 0; i < 180; i++) world.step(); await stats('settled 3s'); const tB = performance.now();
  log(`180 steps in ${(tB - tA).toFixed(0)} ms (${((tB - tA) / 180).toFixed(2)} ms/step incl. readbacks), broken joints: ${broken}`);
  // blast: impulse on bricks within 1.5 m of the wall centre, from the -z side
  const bx = 0, by = 0.7, bz = -1.2, R = 2.2, mass = 0.4 * 0.2 * 0.2 * DENS, J = DV * mass;
  let pushed = 0; for (const b of flat) { const p = b.position; const dx = p[0] - bx, dy = p[1] - by, dz = p[2] - bz; const d = Math.hypot(dx, dy, dz); if (d < R) { const k = J * (1 - d / R); b.applyImpulse([dx / d * k, dy / d * k + k * 0.3, dz / d * k]); pushed++; } }
  for (let i = 0; i < 120; i++) world.step(); await stats('2s after blast'); log(`pushed=${pushed} broken joints=${broken}/${joints}`);
  for (let i = 0; i < 180; i++) world.step(); await stats('5s after blast');
  log('DONE ' + (performance.now() - t0).toFixed(0) + ' ms');
} catch (e) { log('ERR ' + e.message + '\n' + e.stack); }
</script>
